<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Account Statement</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:2rem auto;color:#222}
h1{color:#b31b1b;font-size:1.4rem} table{width:100%;border-collapse:collapse;margin-top:1rem}
th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left} .amt{text-align:right}
.total{font-weight:bold;margin-top:1rem}
</style></head><body>
<h1>Account Statement</h1>
<p>Dear $name,<br>Customer ID: $customer_id<br>Account: $account_masked</p>
<p>Opening balance: $opening_balance</p>
<table><tr><th>Date</th><th>Description</th><th class="amt">Amount</th></tr>
$rows
</table>
<p class="total">Closing balance: $closing_balance</p>
</body></html>
