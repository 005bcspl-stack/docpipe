name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests with coverage gate
        run: pytest --cov=docpipe --cov-fail-under=85

  build-and-run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t docpipe:${{ github.sha }} .
      - name: Run pipeline in container
        run: |
          mkdir out
          docker run --rm -v "$PWD/out:/app/out" docpipe:${{ github.sha }} generate --out out
      - name: Verify document integrity
        run: docker run --rm -v "$PWD/out:/app/out" docpipe:${{ github.sha }} verify --out out
      - uses: actions/upload-artifact@v4
        with:
          name: generated-documents
          path: out/
